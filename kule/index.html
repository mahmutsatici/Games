<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Toy Fort</title>
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;background:#5c3a22;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;outline:none}
  #rotate{display:none;position:fixed;inset:0;background:repeating-linear-gradient(180deg,#d6a96f 0 40px,#bf8f58 40px 80px);color:#fff;z-index:9;align-items:center;justify-content:center;flex-direction:column;gap:22px;font:800 30px "Baloo 2",system-ui,sans-serif;text-align:center;padding:24px;text-shadow:0 3px 0 rgba(90,50,20,.45)}
  @media (orientation:portrait){#rotate{display:flex}}
  #rotate svg{width:150px;height:150px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
<div id="rotate"><svg viewBox="0 0 64 64"><ellipse cx="34" cy="58" rx="20" ry="4" fill="rgba(60,30,10,.3)"/><rect x="18" y="8" width="28" height="48" rx="8" fill="#8f1f1d"/><rect x="18" y="6" width="28" height="46" rx="8" fill="#e8473f"/><rect x="22" y="12" width="20" height="32" rx="4" fill="#fbf6ea"/><circle cx="32" cy="49" r="2.5" fill="#ffd9d2"/><rect x="25" y="26" width="14" height="12" rx="2" fill="#f7c834"/><rect x="25" y="23" width="14" height="5" rx="2" fill="#fff6cf"/></svg><span id="rotate-text">Turn your device</span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
