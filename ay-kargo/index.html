<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Moon Cargo</title>
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;background:#20263a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;outline:none}
  #storm{position:absolute;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(196,108,60,.15) 0%,rgba(196,108,60,.45) 45%,rgba(205,120,70,.8) 100%)}
  #rotate{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#2b3245,#4c5670);color:#f2e6cf;z-index:9;align-items:center;justify-content:center;flex-direction:column;gap:22px;font:700 30px Fredoka,system-ui,sans-serif;text-align:center;padding:24px}
  @media (orientation:portrait){#rotate{display:flex}}
  #rotate svg{width:150px;height:150px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0"></canvas><div id="storm"></div></div>
<div id="rotate"><svg viewBox="0 0 64 64"><rect x="18" y="5" width="28" height="54" rx="7" fill="#c9d0da" stroke="#5d6677" stroke-width="3.5"/><rect x="22" y="11" width="20" height="40" rx="3" fill="#3a4359"/><rect x="25" y="34" width="14" height="6" rx="2" fill="#e8743b" stroke="#8a3e1c" stroke-width="1.5"/><rect x="26" y="25" width="9" height="9" rx="1.5" fill="#c98a4b" stroke="#5e3a1c" stroke-width="1.5"/><circle cx="28" cy="42" r="2.6" fill="#3d4250"/><circle cx="37" cy="42" r="2.6" fill="#3d4250"/><circle cx="38" cy="30" r="1.8" fill="#fff3c4"/></svg><span id="rotate-text">Rotate device</span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
