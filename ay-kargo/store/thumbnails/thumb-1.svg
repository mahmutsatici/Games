<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a22"/>
      <stop offset="0.6" stop-color="#1b1446"/>
      <stop offset="1" stop-color="#3d2a6b"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="0.45" stop-color="#2f8fd6"/>
      <stop offset="1" stop-color="#15326b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5c8c"/>
      <stop offset="1" stop-color="#4a3f6e"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9184ad"/>
      <stop offset="1" stop-color="#6b6090"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2e6"/>
      <stop offset="1" stop-color="#8f88a6"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#d98a3a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#2a7fb8"/>
    </linearGradient>
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#c2437a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#5fb8e0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#8b97b5"/>
    </linearGradient>
    <g id="wheel">
      <circle r="27" fill="#161b26"/>
      <circle r="21" fill="url(#rim)"/>
      <g stroke="#5d6780" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="16"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(60)"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(120)"/>
      </g>
      <circle r="6" fill="#ffd34d"/>
      <circle r="2.5" fill="#fff3b8"/>
    </g>
    <g id="crateShape">
      <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#crate)" stroke="#8a4f1c" stroke-width="2.5"/>
      <path d="M-20 -4 H20 M-20 8 H20" stroke="#8a4f1c" stroke-width="2" opacity="0.6"/>
      <rect x="-13" y="-13" width="8" height="8" fill="#fff0c2" opacity="0.5"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="512" height="384" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="34" r="1.6"/><circle cx="96" cy="72" r="1.1"/><circle cx="150" cy="22" r="1.4"/>
    <circle cx="212" cy="54" r="1"/><circle cx="268" cy="26" r="1.5"/><circle cx="318" cy="118" r="1"/>
    <circle cx="474" cy="40" r="1.6"/><circle cx="486" cy="150" r="1.1"/><circle cx="60" cy="150" r="1.2"/>
    <circle cx="186" cy="130" r="0.9"/><circle cx="230" cy="168" r="1.2"/><circle cx="20" cy="210" r="1"/>
    <circle cx="470" cy="228" r="1.3"/><circle cx="350" cy="200" r="0.9"/><circle cx="130" cy="92" r="1"/>
    <circle cx="442" cy="96" r="0.9"/><circle cx="302" cy="60" r="0.8"/><circle cx="500" cy="300" r="1"/>
  </g>
  <g fill="#cfe9ff">
    <circle cx="403" cy="20" r="2.2"/><circle cx="78" cy="256" r="1.8"/><circle cx="250" cy="110" r="1.8"/>
  </g>

  <!-- Earth -->
  <circle cx="400" cy="92" r="88" fill="url(#glow)"/>
  <circle cx="400" cy="92" r="46" fill="url(#earth)"/>
  <path d="M372 70 q14 -10 26 0 q-4 12 -12 16 q-10 4 -16 -4 z" fill="#4fbf7a" opacity="0.85"/>
  <path d="M410 104 q10 -4 16 6 q-6 10 -14 6 z" fill="#4fbf7a" opacity="0.8"/>
  <path d="M376 118 q8 -2 10 6 q-6 4 -10 -6 z" fill="#f2f8ff" opacity="0.7"/>

  <!-- Far craters' horizon -->
  <path d="M0 248 Q70 205 150 236 T300 226 T430 214 T512 236 V384 H0 Z" fill="url(#farHill)"/>

  <!-- Mid hills -->
  <path d="M0 282 Q90 246 180 270 T360 262 T512 272 V384 H0 Z" fill="url(#midHill)"/>
  <circle cx="82" cy="276" r="13" fill="#5a4f7e" opacity="0.6"/>
  <circle cx="82" cy="276" r="13" fill="none" stroke="#c6bddb" stroke-width="2" opacity="0.35"/>
  <circle cx="440" cy="250" r="9" fill="#5a4f7e" opacity="0.6"/>
  <circle cx="440" cy="250" r="9" fill="none" stroke="#c6bddb" stroke-width="2" opacity="0.35"/>

  <!-- Foreground ground -->
  <path d="M0 326 Q130 300 256 324 T512 318 V384 H0 Z" fill="url(#ground)"/>
  <ellipse cx="56" cy="352" rx="26" ry="7" fill="#7b7396" opacity="0.5"/>
  <ellipse cx="56" cy="350" rx="22" ry="5" fill="#b9b1cc" opacity="0.6"/>
  <ellipse cx="438" cy="358" rx="34" ry="9" fill="#7b7396" opacity="0.5"/>
  <ellipse cx="438" cy="356" rx="30" ry="6" fill="#b9b1cc" opacity="0.6"/>
  <ellipse cx="330" cy="370" rx="16" ry="4" fill="#7b7396" opacity="0.4"/>

  <!-- Rover shadow -->
  <ellipse cx="256" cy="338" rx="130" ry="9" fill="#2b2446" opacity="0.4"/>

  <!-- Rover -->
  <g transform="translate(256 262)">
    <!-- headlight glow -->
    <circle cx="124" cy="14" r="26" fill="url(#headlight)"/>
    <!-- antenna -->
    <line x1="78" y1="-40" x2="78" y2="-74" stroke="#cfd8ea" stroke-width="3"/>
    <circle cx="78" cy="-78" r="6" fill="#ff5f8f"/>
    <circle cx="78" cy="-78" r="14" fill="#ff5f8f" opacity="0.25"/>
    <!-- chassis -->
    <rect x="-124" y="-4" width="248" height="44" rx="12" fill="url(#body)" stroke="#1d4f7a" stroke-width="3"/>
    <rect x="-112" y="4" width="224" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <!-- cargo bed rails -->
    <rect x="-112" y="-12" width="150" height="10" rx="3" fill="#2a7fb8"/>
    <!-- cabin -->
    <rect x="44" y="-58" width="74" height="58" rx="10" fill="url(#cabin)" stroke="#8a2b56" stroke-width="3"/>
    <rect x="54" y="-48" width="52" height="26" rx="6" fill="url(#window)"/>
    <rect x="58" y="-44" width="14" height="5" rx="2" fill="#ffffff" opacity="0.7"/>
    <!-- crates on bed -->
    <use href="#crateShape" x="-92" y="-32"/>
    <use href="#crateShape" x="-48" y="-32"/>
    <use href="#crateShape" x="-4" y="-32"/>
    <use href="#crateShape" x="-70" y="-74" transform="rotate(-6 -70 -54)"/>
    <!-- wheels -->
    <use href="#wheel" x="-74" y="46"/>
    <use href="#wheel" x="74" y="46"/>
  </g>

  <!-- Dust sparkles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="170" cy="354" r="2"/><circle cx="182" cy="362" r="1.4"/><circle cx="156" cy="366" r="1.2"/>
  </g>
</svg>
