<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f1e"/>
      <stop offset="0.55" stop-color="#7a2a2a"/>
      <stop offset="1" stop-color="#e0844a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset="0.4" stop-color="#ffc977" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phobos" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d8c9bf"/>
      <stop offset="1" stop-color="#6f5a55"/>
    </radialGradient>
    <radialGradient id="headlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a04a3a"/>
      <stop offset="1" stop-color="#7a3430"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c26a40"/>
      <stop offset="1" stop-color="#94442c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a266"/>
      <stop offset="1" stop-color="#b05c34"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#b8502a"/>
    </linearGradient>
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef0d8"/>
      <stop offset="1" stop-color="#2e9c8a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset="1" stop-color="#5fc7c0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4ea"/>
      <stop offset="1" stop-color="#a98a7e"/>
    </linearGradient>
    <g id="wheel">
      <circle r="27" fill="#1f1418"/>
      <circle r="21" fill="url(#rim)"/>
      <g stroke="#6e5148" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="16"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(60)"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(120)"/>
      </g>
      <circle r="6" fill="#ffd34d"/>
      <circle r="2.5" fill="#fff3b8"/>
    </g>
    <g id="crateShape">
      <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#crate)" stroke="#8a4a1a" stroke-width="2.5"/>
      <path d="M-20 -4 H20 M-20 8 H20" stroke="#8a4a1a" stroke-width="2" opacity="0.6"/>
      <rect x="-13" y="-13" width="8" height="8" fill="#fff3cc" opacity="0.5"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="512" height="384" fill="url(#sky)"/>

  <!-- Dust haze and sun -->
  <circle cx="396" cy="118" r="120" fill="url(#sun)" opacity="0.8"/>
  <circle cx="396" cy="118" r="26" fill="#fff1c4"/>
  <ellipse cx="120" cy="90" rx="180" ry="24" fill="#f5b48a" opacity="0.12"/>
  <ellipse cx="300" cy="150" rx="220" ry="18" fill="#ffd0a0" opacity="0.1"/>

  <!-- Stars -->
  <g fill="#fff0e0">
    <circle cx="40" cy="36" r="1.4"/><circle cx="130" cy="60" r="1"/><circle cx="220" cy="26" r="1.3"/>
    <circle cx="300" cy="50" r="0.9"/><circle cx="480" cy="40" r="1.3"/><circle cx="62" cy="130" r="1"/>
    <circle cx="180" cy="110" r="0.8"/><circle cx="470" cy="180" r="0.9"/>
  </g>

  <!-- Phobos -->
  <circle cx="110" cy="84" r="16" fill="url(#phobos)"/>
  <circle cx="104" cy="78" r="3" fill="#4d3a36" opacity="0.5"/>
  <circle cx="116" cy="90" r="2" fill="#4d3a36" opacity="0.5"/>

  <!-- Far hills -->
  <path d="M0 244 Q80 200 170 232 T330 222 T512 228 V384 H0 Z" fill="url(#farHill)"/>
  <!-- Mid hills -->
  <path d="M0 284 Q100 250 200 272 T380 262 T512 276 V384 H0 Z" fill="url(#midHill)"/>
  <circle cx="92" cy="278" r="14" fill="#7a3426" opacity="0.6"/>
  <circle cx="92" cy="278" r="14" fill="none" stroke="#ffb88a" stroke-width="2" opacity="0.3"/>
  <circle cx="444" cy="252" r="10" fill="#7a3426" opacity="0.6"/>
  <circle cx="444" cy="252" r="10" fill="none" stroke="#ffb88a" stroke-width="2" opacity="0.3"/>

  <!-- Foreground ground -->
  <path d="M0 326 Q130 300 256 324 T512 318 V384 H0 Z" fill="url(#ground)"/>
  <ellipse cx="56" cy="352" rx="26" ry="7" fill="#7a3020" opacity="0.5"/>
  <ellipse cx="56" cy="350" rx="22" ry="5" fill="#f2b98a" opacity="0.5"/>
  <ellipse cx="438" cy="358" rx="34" ry="9" fill="#7a3020" opacity="0.5"/>
  <ellipse cx="438" cy="356" rx="30" ry="6" fill="#f2b98a" opacity="0.5"/>
  <ellipse cx="330" cy="370" rx="16" ry="4" fill="#7a3020" opacity="0.4"/>

  <!-- Rover shadow -->
  <ellipse cx="256" cy="338" rx="130" ry="9" fill="#2b0f1e" opacity="0.45"/>

  <!-- Rover -->
  <g transform="translate(256 262)">
    <circle cx="124" cy="14" r="26" fill="url(#headlight)"/>
    <line x1="78" y1="-40" x2="78" y2="-74" stroke="#ffe3cf" stroke-width="3"/>
    <circle cx="78" cy="-78" r="6" fill="#7fffd4"/>
    <circle cx="78" cy="-78" r="14" fill="#7fffd4" opacity="0.25"/>
    <rect x="-124" y="-4" width="248" height="44" rx="12" fill="url(#body)" stroke="#7a2c12" stroke-width="3"/>
    <rect x="-112" y="4" width="224" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="-112" y="-12" width="150" height="10" rx="3" fill="#b8502a"/>
    <rect x="44" y="-58" width="74" height="58" rx="10" fill="url(#cabin)" stroke="#1d6b60" stroke-width="3"/>
    <rect x="54" y="-48" width="52" height="26" rx="6" fill="url(#window)"/>
    <rect x="58" y="-44" width="14" height="5" rx="2" fill="#ffffff" opacity="0.7"/>
    <use href="#crateShape" x="-92" y="-32"/>
    <use href="#crateShape" x="-48" y="-32"/>
    <use href="#crateShape" x="-4" y="-32"/>
    <use href="#crateShape" x="-70" y="-74" transform="rotate(-6 -70 -54)"/>
    <use href="#wheel" x="-74" y="46"/>
    <use href="#wheel" x="74" y="46"/>
  </g>

  <!-- Dust sparkles -->
  <g fill="#ffe7cf" opacity="0.7">
    <circle cx="170" cy="354" r="2"/><circle cx="182" cy="362" r="1.4"/><circle cx="156" cy="366" r="1.2"/>
  </g>
</svg>
