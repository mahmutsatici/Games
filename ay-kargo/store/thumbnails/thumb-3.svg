<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04162e"/>
      <stop offset="0.6" stop-color="#0f3a66"/>
      <stop offset="1" stop-color="#3f8fb8"/>
    </linearGradient>
    <radialGradient id="gasGiant" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="0.5" stop-color="#4fa8d8"/>
      <stop offset="1" stop-color="#17457a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ee7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8ee7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fdff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9fdff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ea"/>
      <stop offset="1" stop-color="#5a9fc4"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2f1ff"/>
      <stop offset="1" stop-color="#8cc7e6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fdff"/>
      <stop offset="1" stop-color="#9ed3ee"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f0ff"/>
      <stop offset="1" stop-color="#3fa6d6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8bb8d6"/>
    </linearGradient>
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="1" stop-color="#1f6fb0"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fd6f2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8aa6bf"/>
    </linearGradient>
    <g id="wheel">
      <circle r="27" fill="#122232"/>
      <circle r="21" fill="url(#rim)"/>
      <g stroke="#4e6b86" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="16"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(60)"/>
        <line x1="0" y1="-16" x2="0" y2="16" transform="rotate(120)"/>
      </g>
      <circle r="6" fill="#ffd34d"/>
      <circle r="2.5" fill="#fff3b8"/>
    </g>
    <g id="crateShape">
      <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#crate)" stroke="#1f5f8a" stroke-width="2.5"/>
      <path d="M-20 -4 H20 M-20 8 H20" stroke="#1f5f8a" stroke-width="2" opacity="0.5"/>
      <rect x="-13" y="-13" width="8" height="8" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="512" height="384" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="26" cy="30" r="1.5"/><circle cx="92" cy="66" r="1"/><circle cx="160" cy="20" r="1.3"/>
    <circle cx="232" cy="48" r="1"/><circle cx="292" cy="24" r="1.4"/><circle cx="352" cy="78" r="0.9"/>
    <circle cx="482" cy="34" r="1.5"/><circle cx="506" cy="150" r="1"/><circle cx="48" cy="146" r="1.1"/>
    <circle cx="200" cy="128" r="0.9"/><circle cx="20" cy="216" r="1"/><circle cx="462" cy="222" r="1.2"/>
  </g>

  <!-- Ice giant planet with soft glow -->
  <circle cx="390" cy="104" r="100" fill="url(#glow)"/>
  <circle cx="390" cy="104" r="52" fill="url(#gasGiant)"/>
  <path d="M344 92 Q390 84 438 96" stroke="#e6fbff" stroke-width="5" fill="none" opacity="0.35"/>
  <path d="M348 114 Q392 108 432 118" stroke="#1d5f94" stroke-width="4" fill="none" opacity="0.35"/>
  <circle cx="390" cy="104" r="52" fill="none" stroke="#bfe9ff" stroke-width="2" opacity="0.35"/>

  <!-- Far ice ridges -->
  <path d="M0 246 Q70 206 150 236 T300 226 T430 210 T512 234 V384 H0 Z" fill="url(#farHill)"/>
  <!-- Mid ridges -->
  <path d="M0 284 Q90 250 180 272 T360 262 T512 270 V384 H0 Z" fill="url(#midHill)"/>
  <!-- Ice craters -->
  <ellipse cx="84" cy="278" rx="16" ry="6" fill="#4f93bd" opacity="0.5"/>
  <ellipse cx="84" cy="277" rx="13" ry="4" fill="#e6fbff" opacity="0.7"/>
  <ellipse cx="442" cy="252" rx="11" ry="4" fill="#4f93bd" opacity="0.5"/>
  <ellipse cx="442" cy="251" rx="9" ry="3" fill="#e6fbff" opacity="0.7"/>

  <!-- Foreground ice -->
  <path d="M0 326 Q130 300 256 324 T512 318 V384 H0 Z" fill="url(#ground)"/>
  <!-- Ice cracks -->
  <path d="M250 340 L266 352 L258 366 L276 380" stroke="#6cb6dd" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M60 360 L84 366 L78 378" stroke="#6cb6dd" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="56" cy="350" rx="22" ry="5" fill="#7fc3e6" opacity="0.5"/>
  <ellipse cx="438" cy="356" rx="30" ry="6" fill="#7fc3e6" opacity="0.5"/>

  <!-- Rover shadow -->
  <ellipse cx="256" cy="338" rx="130" ry="9" fill="#04162e" opacity="0.4"/>

  <!-- Rover -->
  <g transform="translate(256 262)">
    <circle cx="124" cy="14" r="26" fill="url(#headlight)"/>
    <line x1="78" y1="-40" x2="78" y2="-74" stroke="#e6fbff" stroke-width="3"/>
    <circle cx="78" cy="-78" r="6" fill="#7ef0ff"/>
    <circle cx="78" cy="-78" r="14" fill="#7ef0ff" opacity="0.3"/>
    <rect x="-124" y="-4" width="248" height="44" rx="12" fill="url(#body)" stroke="#2e5f85" stroke-width="3"/>
    <rect x="-112" y="4" width="224" height="6" rx="3" fill="#2a7fb8" opacity="0.35"/>
    <rect x="-112" y="-12" width="150" height="10" rx="3" fill="#8bb8d6"/>
    <rect x="44" y="-58" width="74" height="58" rx="10" fill="url(#cabin)" stroke="#16507f" stroke-width="3"/>
    <rect x="54" y="-48" width="52" height="26" rx="6" fill="url(#window)"/>
    <rect x="58" y="-44" width="14" height="5" rx="2" fill="#ffffff" opacity="0.8"/>
    <use href="#crateShape" x="-92" y="-32"/>
    <use href="#crateShape" x="-48" y="-32"/>
    <use href="#crateShape" x="-4" y="-32"/>
    <use href="#crateShape" x="-70" y="-74" transform="rotate(-6 -70 -54)"/>
    <use href="#wheel" x="-74" y="46"/>
    <use href="#wheel" x="74" y="46"/>
  </g>

  <!-- Snow sparkles -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="170" cy="354" r="2"/><circle cx="182" cy="362" r="1.4"/><circle cx="156" cy="366" r="1.2"/>
    <circle cx="340" cy="346" r="1.4"/><circle cx="352" cy="360" r="1"/>
  </g>
</svg>
