<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="512" height="384">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="384" fill="url(#nebula)"/>

  <!-- Background Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="450" cy="80" r="2"/>
    <circle cx="470" cy="300" r="1.2"/>
    <circle cx="80" cy="320" r="1"/>
    <circle cx="200" cy="40" r="1"/>
  </g>

  <!-- Left: Cyan Spiked Core -->
  <g transform="translate(140, 200)">
    <circle cx="0" cy="0" r="85" fill="url(#cyanGlow)"/>
    <!-- Outer dashed energy ring -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 8" opacity="0.8"/>
    <!-- Spikes -->
    <g fill="#22d3ee" stroke="#e0f2fe" stroke-width="1.5">
      <polygon points="0,-76 -6,-60 6,-60"/>
      <polygon points="76,0 60,-6 60,6"/>
      <polygon points="0,76 -6,60 6,60"/>
      <polygon points="-76,0 -60,-6 -60,6"/>
      <polygon points="54,-54 40,-48 48,-40"/>
      <polygon points="54,54 48,40 40,48"/>
      <polygon points="-54,54 -40,48 -48,40"/>
      <polygon points="-54,-54 -48,-40 -40,-48"/>
    </g>
    <!-- Core Hexagon -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#0891b2" stroke="#67e8f9" stroke-width="4"/>
    <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="#bae6fd"/>
  </g>

  <!-- Right: Top-Tier Gold Crystal Star Module (Large, Hero) -->
  <g transform="translate(350, 180)">
    <circle cx="0" cy="0" r="110" fill="url(#goldGlow)"/>
    <!-- Orbiting Energy Sparks -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="6 12" opacity="0.7"/>

    <!-- Outer Spikes Band -->
    <g fill="#eab308" stroke="#fef08a" stroke-width="1.5">
      <polygon points="0,-95 -7,-78 7,-78"/>
      <polygon points="95,0 78,-7 78,7"/>
      <polygon points="0,95 -7,78 7,78"/>
      <polygon points="-95,0 -78,-7 -78,7"/>
      <polygon points="67,-67 52,-60 60,-52"/>
      <polygon points="67,67 60,52 52,60"/>
      <polygon points="-67,67 -52,60 -60,52"/>
      <polygon points="-67,-67 -60,-52 -52,-60"/>
    </g>

    <!-- Star Body -->
    <polygon points="0,-65 17,-22 62,-22 25,6 39,50 0,24 -39,50 -25,6 -62,-22 -17,-22" fill="#eab308" stroke="#fef08a" stroke-width="5"/>
    <polygon points="0,-38 10,-12 36,-12 15,4 23,30 0,15 -23,30 -15,4 -36,-12 -10,-12" fill="#fffbeb"/>
  </g>

  <!-- Background Mini Drones -->
  <g transform="translate(230, 80) scale(0.65)">
    <line x1="-16" y1="-2" x2="16" y2="-2" stroke="#64748b" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="#f8fafc"/>
    <circle cx="0" cy="1" r="2.5" fill="#38bdf8"/>
    <circle cx="0" cy="18" r="8" fill="#4ade80" stroke="#86efac" stroke-width="1.5"/>
  </g>

  <!-- Energy Light Rays -->
  <line x1="200" y1="180" x2="280" y2="180" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="240" cy="180" r="5" fill="#ffffff"/>
</svg>
