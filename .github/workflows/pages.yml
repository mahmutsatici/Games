name: Deploy games to Pages

on:
  push:
    branches: [main]
    paths:
      - 'ay-kargo/**'
      - 'zip-sucuk/**'
      - 'kule/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ay-kargo/package-lock.json
            zip-sucuk/package-lock.json
            kule/package-lock.json
      # ay-kargo stays at the site root (existing link), each other game gets its own sub-folder
      - name: Build
        run: |
          (cd ay-kargo && npm ci && VITE_PORTAL=none npm run build)
          (cd zip-sucuk && npm ci && VITE_PORTAL=none npm run build)
          (cd kule && npm ci && VITE_PORTAL=none npm run build)
          mkdir -p site && cp -r ay-kargo/dist/. site/ && mkdir -p site/zip-sucuk && cp -r zip-sucuk/dist/. site/zip-sucuk/ && mkdir -p site/kule && cp -r kule/dist/. site/kule/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
