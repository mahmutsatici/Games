<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Sucuk Hop</title>
<style>
  html,body{margin:0;height:100%;background:#2b1a14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;outline:none}
  #rotate{display:none;position:fixed;inset:0;background:#2b1a14;color:#fff;z-index:9;align-items:center;justify-content:center;flex-direction:column;gap:18px;font:800 22px system-ui,sans-serif;text-align:center;padding:24px}
  @media (orientation:portrait){#rotate{display:flex}}
  #rotate svg{width:96px;height:96px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><span id="rotate-text">Rotate device</span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
