<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Sucuk Hop</title>
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
  html,body{margin:0;height:100%;background:#2b1a14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;outline:none}
  #rotate{display:none;position:fixed;inset:0;background:#f6ead2 repeating-conic-gradient(#efdcb9 0 25%,transparent 0 50%) 0 0/64px 64px;color:#a3321e;z-index:9;align-items:center;justify-content:center;flex-direction:column;gap:22px;font:400 30px "Erica One",system-ui,sans-serif;text-align:center;padding:24px;-webkit-text-stroke:0}
  @media (orientation:portrait){#rotate{display:flex}}
  #rotate svg{width:150px;height:150px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
<div id="rotate"><svg viewBox="0 0 64 64"><rect x="18" y="6" width="28" height="52" rx="7" fill="#f1d9ad" stroke="#a5713c" stroke-width="3.5"/><rect x="22" y="12" width="20" height="38" rx="3" fill="#fffaf0"/><rect x="27" y="18" width="10" height="26" rx="5" fill="#a3321e" stroke="#5a150a" stroke-width="2"/><circle cx="30" cy="23" r="1.8" fill="#fff"/><circle cx="34" cy="23" r="1.8" fill="#fff"/></svg><span id="rotate-text">Rotate device</span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
